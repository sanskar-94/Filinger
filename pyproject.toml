[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filings-lab"
version = "0.1.0"
description = "Filings Intelligence Lab: can the language in SEC filings predict the stock's reaction?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.5",
  "requests>=2.31",
  "scipy>=1.11",
  "tabulate>=0.9",  # markdown tables in every generated report
  "pyyaml>=6",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.1", "scikit-learn>=1.4", "statsmodels>=0.14", "mlflow>=2.10", "duckdb>=1.0"]
spark = ["pyspark>=3.5", "boto3>=1.34"]
aws = ["boto3>=1.34"]  # s3:// raw filings, lake listing and experiment log export; Parquet IO uses PyArrow's S3
llm = ["torch>=2.2", "transformers>=4.44", "peft>=0.12", "trl>=0.11", "datasets>=2.20", "bitsandbytes>=0.43", "accelerate>=0.33", "anthropic>=0.40", "openai>=1.40"]
mlx = ["mlx-lm>=0.20"]  # Apple Silicon fine tuning (scripts/mac_finetune.sh); on Linux add "mlx[cpu]"
serve = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20", "httpx>=0.27"]
agent = ["rank-bm25>=0.2.2", "anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
flab = "filings_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # long prompt and SQL strings read better unwrapped

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
