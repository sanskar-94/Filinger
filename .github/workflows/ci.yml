name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
permissions: {contents: read}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check src tests scripts loadtest

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -e ".[ml,serve,agent,dev]" tabulate duckdb
      - run: pytest -q --durations=10

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[ml,dev]" "pyspark>=4.0,<5"
      - run: pytest -q tests/test_spark_parity.py

  llm-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[ml,dev]" transformers peft trl datasets accelerate tokenizers
      - run: pytest -q tests/test_lora_smoke.py

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[ml,serve,agent,dev]" tabulate duckdb
      - run: bash scripts/e2e.sh "$RUNNER_TEMP/e2e"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate the Kubernetes overlays
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for overlay in dev prod; do
            kubectl kustomize infra/k8s/overlays/$overlay > /tmp/$overlay.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/$overlay.yaml
          done
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format and validate
        run: |
          for dir in infra/aws infra/eks; do
            terraform -chdir=$dir fmt -check -recursive
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
