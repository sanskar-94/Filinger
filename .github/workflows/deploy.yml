name: deploy
on:
  push:
    branches: [main]
    paths: ["src/**", "web/**", "Dockerfile", "Dockerfile.vllm", "infra/k8s/**", "pyproject.toml"]
  workflow_dispatch:
permissions: {contents: read, id-token: write}
env:
  AWS_REGION: us-east-1
  REGISTRY: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: filings-lab-prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}"}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/filings-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.REGISTRY }}/filings-web:${{ github.sha }}
      - name: Build and push vLLM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vllm
          push: true
          tags: ${{ env.REGISTRY }}/filings-vllm:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # requires a reviewer's approval in the repository settings
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}"}
      - run: aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
      - name: Pin images to this commit and apply
        working-directory: infra/k8s/overlays/prod
        run: |
          kustomize edit set image filings-api=$REGISTRY/filings-api:${{ github.sha }}
          kustomize edit set image filings-vllm=$REGISTRY/filings-vllm:${{ github.sha }}
          kustomize edit set image filings-web=$REGISTRY/filings-web:${{ github.sha }}
          kubectl apply -k .
      - run: kubectl -n filings-lab rollout status deploy/filings-api --timeout=10m
      - run: kubectl -n filings-lab rollout status deploy/vllm --timeout=20m
      - run: kubectl -n filings-lab rollout status deploy/filings-web --timeout=10m
      - name: Smoke test
        run: kubectl -n filings-lab run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- curl -fsS http://filings-api/readyz
