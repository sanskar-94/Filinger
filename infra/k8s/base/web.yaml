apiVersion: apps/v1
kind: Deployment
metadata:
  name: filings-web
  labels: {app: filings-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: filings-web}}
  template:
    metadata:
      labels: {app: filings-web}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: filings-web:latest
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: FLAB_API_URL, value: "http://filings-api.filings-lab.svc.cluster.local"}
            - name: FLAB_API_KEY
              valueFrom: {secretKeyRef: {name: filings-web-key, key: key}}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20, failureThreshold: 6}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: next-cache, mountPath: /app/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: next-cache, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: filings-web
spec:
  selector: {app: filings-web}
  ports: [{name: http, port: 80, targetPort: http}]
