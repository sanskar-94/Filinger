apiVersion: apps/v1
kind: Deployment
metadata:
  name: filings-web
  labels: {app: filings-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: filings-web}}
  template:
    metadata:
      labels: {app: filings-web}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: filings-web:latest
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: FLAB_API_URL, value: "http://filings-api.filings-lab.svc.cluster.local"}
            - name: FLAB_API_KEY
              valueFrom: {secretKeyRef: {name: filings-web-key, key: key}}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: filings-web
spec:
  selector: {app: filings-web}
  ports: [{name: http, port: 80, targetPort: http}]
