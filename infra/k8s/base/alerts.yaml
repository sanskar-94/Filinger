# GENERATED by scripts/render_k8s.py from infra/monitoring/alerts.yml. Edit that file instead.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: filings-lab-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: filings-lab
    rules:
    - alert: ApiHighErrorRate
      expr: sum(rate(flab_requests_total{status=~"5.."}[5m])) / sum(rate(flab_requests_total[5m])) > 0.02
      for: 10m
      labels:
        severity: page
      annotations:
        summary: More than 2% of API requests fail
    - alert: ApiLatencyP95High
      expr: histogram_quantile(0.95, sum by (le) (rate(flab_request_latency_seconds_bucket{route="/v1/extract"}[5m]))) > 8
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: Extraction p95 latency above 8s
    - alert: ExtractionFallbackRateHigh
      expr: sum(rate(flab_extractions_total{outcome="fallback"}[15m])) / sum(rate(flab_extractions_total[15m])) > 0.1
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: More than 10% of extractions served by the rule fallback (LLM unhealthy or invalid JSON)
    - alert: LlmCircuitBreakerOpen
      expr: max(flab_llm_breaker_open) == 1
      for: 5m
      labels:
        severity: page
      annotations:
        summary: 'LLM circuit breaker open: vLLM unreachable or failing'
    - alert: FeatureDriftHigh
      expr: max by (feature) (flab_feature_psi) > 0.25
      for: 1h
      labels:
        severity: ticket
      annotations:
        summary: 'PSI above 0.25 for {{ $labels.feature }}: retraining or investigation needed'
    - alert: PredictionDrift
      expr: flab_feature_psi{feature="prediction"} > 0.2
      for: 1h
      labels:
        severity: ticket
      annotations:
        summary: Distribution of predicted probabilities moved away from training
    - alert: VllmQueueBacklog
      expr: sum(vllm:num_requests_waiting) > 20
      for: 5m
      labels:
        severity: ticket
      annotations:
        summary: 'vLLM queue backlog: autoscaling may be stuck on GPU capacity'
