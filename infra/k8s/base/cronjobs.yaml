# Nightly drift report on recent filings, pushed to the Prometheus Pushgateway so the FeatureDriftHigh alert
# covers the data as well as live traffic; weekly retraining that registers a challenger; a daily A/B readout
# over every API replica's experiment log. Promotion to champion stays a reviewed pull request through the
# model gate.
#
# Jobs whose results go back to S3 pair the work container with an aws-cli uploader. The work container writes
# its exit code to /data/.exit whatever happens; the uploader waits for that file, uploads only on success, and
# exits with the same code, so the Job reports the real outcome and never uploads a half finished result.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-report
spec:
  schedule: "17 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: filings-lab
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: sync
              image: amazon/aws-cli:2.27.0
              command: ["sh", "-c", "aws s3 sync $MODEL_S3_PREFIX /data/registry && aws s3 sync $LAKE_S3_PREFIX/gold /data/lake/gold"]
              envFrom: [{configMapRef: {name: filings-api}}]
              volumeMounts: [{name: data, mountPath: /data}]
          containers:
            - name: drift
              image: filings-api:latest
              command: ["flab", "drift-report", "--lake", "/data/lake", "--out", "/data/reports/drift",
                        "--pushgateway", "prometheus-pushgateway.monitoring.svc:9091"]
              envFrom: [{configMapRef: {name: filings-api}}]
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
              volumeMounts: [{name: data, mountPath: /data}]
          volumes: [{name: data, emptyDir: {}}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain-challenger
spec:
  schedule: "43 7 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: filings-lab-trainer  # write access to the registry prefix only
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: sync
              image: amazon/aws-cli:2.27.0
              command: ["sh", "-c", "aws s3 sync $LAKE_S3_PREFIX/gold /data/lake/gold && aws s3 sync $MODEL_S3_PREFIX /data/registry"]
              envFrom: [{configMapRef: {name: filings-api}}]
              volumeMounts: [{name: data, mountPath: /data}]
          containers:
            - name: retrain
              image: filings-api:latest
              # the data quality gate reads the whole lake straight from S3; training needs only gold/features
              command: ["sh", "-c", "flab dq --lake $LAKE_S3_PREFIX --out /data/reports/dq && flab train --lake /data/lake --out /data/reports/phase2 --permutations 20 && flab register --lake /data/lake --metrics /data/reports/phase2/metrics.json --alias challenger; rc=$?; echo $rc > /data/.exit; exit $rc"]
              envFrom: [{configMapRef: {name: filings-api}}]
              resources: {requests: {cpu: "2", memory: 4Gi}, limits: {memory: 8Gi}}
              volumeMounts: [{name: data, mountPath: /data}]
            - name: upload
              image: amazon/aws-cli:2.27.0
              command: ["sh", "-c", "until [ -f /data/.exit ]; do sleep 15; done; rc=$(cat /data/.exit); [ \"$rc\" = 0 ] && aws s3 sync /data/registry $MODEL_S3_PREFIX; exit $rc"]
              envFrom: [{configMapRef: {name: filings-api}}]
              volumeMounts: [{name: data, mountPath: /data}]
          volumes: [{name: data, emptyDir: {}}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: experiment-readout
spec:
  schedule: "29 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: filings-lab-trainer  # reads every replica's log, writes the readout
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: readout
              image: filings-api:latest
              command: ["sh", "-c", "flab ab-analyze --experiment /config/experiment.json --db $FLAB_EVENT_EXPORT/ --out /data/readout; rc=$?; echo $rc > /data/.exit; exit $rc"]
              envFrom: [{configMapRef: {name: filings-api}}]
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: experiment, mountPath: /config, readOnly: true}
            - name: upload
              image: amazon/aws-cli:2.27.0
              command: ["sh", "-c", "until [ -f /data/.exit ]; do sleep 10; done; rc=$(cat /data/.exit); [ \"$rc\" = 0 ] && aws s3 sync /data/readout ${FLAB_EVENT_EXPORT%/events}/readouts/$$(date -u +%F); exit $rc"]
              envFrom: [{configMapRef: {name: filings-api}}]
              volumeMounts: [{name: data, mountPath: /data}]
          volumes:
            - {name: data, emptyDir: {}}
            - {name: experiment, configMap: {name: experiment-config}}
