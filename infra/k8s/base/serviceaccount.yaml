# IRSA: the roles are defined in infra/eks/main.tf.
# filings-lab: the API and drift jobs. Reads the registry and the lake, writes only experiments/events/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filings-lab
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/filings-lab-serving
---
# filings-lab-trainer: retraining and the A/B readout. Reads the lake and the experiment logs, writes the
# registry and experiments/readouts/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filings-lab-trainer
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/filings-lab-trainer
