apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - {name: filings-api, newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/filings-api, newTag: dev}
  - {name: filings-vllm, newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/filings-vllm, newTag: dev}
  - {name: filings-web, newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/filings-web, newTag: dev}
patches:
  - target: {kind: HorizontalPodAutoscaler, name: filings-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
  - target: {kind: ConfigMap, name: filings-api}
    patch: |-
      - {op: replace, path: /data/MODEL_S3_PREFIX, value: s3://filings-lab-dev/registry}
      - {op: replace, path: /data/LAKE_S3_PREFIX, value: s3://filings-lab-dev/lake/gold}
